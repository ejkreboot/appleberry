<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apple Berry Homeschool Academy</title>
<meta name="description" content="Interactive learning tools from Apple Berry Homeschool Academy.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍎</text></svg>">
<style>
  :root {
    --bg: #fbfaf7;
    --fg: #1f1d1a;
    --muted: #6b665e;
    --line: #e6e2da;
    --accent: #b3263b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161514;
      --fg: #ece9e3;
      --muted: #9a958c;
      --line: #2e2c29;
      --accent: #e0677a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 17px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main {
    max-width: 40rem;
    margin: 0 auto;
    padding: 5rem 1.25rem 4rem;
  }
  header { margin-bottom: 3.5rem; }
  h1 {
    margin: 0;
    font: 600 clamp(1.8rem, 5vw, 2.4rem)/1.15 ui-serif, Georgia, serif;
    letter-spacing: -0.01em;
  }
  h1 span { color: var(--accent); }
  header p { margin: .5rem 0 0; color: var(--muted); }
  h2 {
    margin: 0 0 .75rem;
    font-size: .8rem;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  li { border-bottom: 1px solid var(--line); }
  a {
    display: block;
    padding: .9rem 0;
    color: inherit;
    text-decoration: none;
  }
  a strong { font-weight: 600; }
  a span { display: block; color: var(--muted); font-size: .92rem; }
  a:hover strong, a:focus-visible strong { color: var(--accent); }
  footer { margin-top: 4rem; color: var(--muted); font-size: .85rem; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Apple <span>Berry</span> <br>Homeschool<br>Academy</h1>
    <p>Interactive tools for curious learners.</p>
  </header>

  <section>
    <h2>Chemistry</h2>
    <ul>
      <li><a href="chemistry/orbital-atlas.html">
        <strong>Orbital Atlas</strong>
        <span>Explore quantum numbers and what makes an orbital allowed.</span>
      </a></li>
      <li><a href="chemistry/madelungs-madness.html">
        <strong>Madelung's Madness</strong>
        <span>Steer each electron into the orbital it fills next.</span>
      </a></li>
    </ul>
  </section>

  <footer>&copy; Apple Berry Homeschool Academy</footer>
</main>
</body>
</html>
